<!DOCTYPE html>
<html>
<head>
  <title>Stock Grid</title>
  <style>
    table {
      border-collapse: collapse;
      width: 500px;
      font-family: Arial;
    }
    th, td {
      border: 1px solid #444;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>

<h2>Stock Prices (TradingView Live)</h2>

<table>
  <tr>
    <th>Ticker</th>
    <th>Last Close</th>
    <th>Pre‑Market</th>
    <th>After‑Hours</th>
  </tr>

  <tr><td>SNAL</td><td id="SNAL-close"></td><td id="SNAL-pre"></td><td id="SNAL-after"></td></tr>
  <tr><td>NEXR</td><td id="NEXR-close"></td><td id="NEXR-pre"></td><td id="NEXR-after"></td></tr>
  <tr><td>PRZO</td><td id="PRZO-close"></td><td id="PRZO-pre"></td><td id="PRZO-after"></td></tr>
  <tr><td>ASTC</td><td id="ASTC-close"></td><td id="ASTC-pre"></td><td id="ASTC-after"></td></tr>
  <tr><td>HL</td><td id="HL-close"></td><td id="HL-pre"></td><td id="HL-after"></td></tr>
  <tr><td>SBSW</td><td id="SBSW-close"></td><td id="SBSW-pre"></td><td id="SBSW-after"></td></tr>

</table>

<script>
const TV_URL = "wss://data.tradingview.com/socket.io/websocket";

function uid() {
  return Math.random().toString(36).substring(2, 12);
}

function send(ws, m, p) {
  ws.send(`~m~${JSON.stringify({ m, p }).length}~m~${JSON.stringify({ m, p })}`);
}

function connectTV(ticker) {
  const session = "qs_" + uid();
  const chartSession = "cs_" + uid();

  const ws = new WebSocket(TV_URL + "?from=chart%2F&date=" + Date.now());

  ws.onopen = () => {
    send(ws, "set_auth_token", ["unauthorized"]);
    send(ws, "chart_create_session", [chartSession, ""]);
    send(ws, "quote_create_session", [session]);

    send(ws, "quote_add_symbols", [
      session,
      ticker,
      { flags: ["extended_hours"] }
    ]);

    send(ws, "resolve_symbol", [chartSession, "symbol_1", ticker]);
    send(ws, "create_series", [chartSession, "s1", "symbol_1", "1", 300]);
  };

  ws.onmessage = (msg) => {
    const parts = msg.data.split("~m~");

    for (let i = 0; i < parts.length; i++) {
      if (!parts[i] || isNaN(parts[i])) continue;

      const jsonStr = parts[i + 1];
      if (!jsonStr) continue;

      let payload;
      try {
        payload = JSON.parse(jsonStr);
      } catch {
        continue;
      }

      if (payload.m === "qsd") {
        const q = payload.p[1];

        document.getElementById(ticker + "-close").innerText = q.prev_close_price ?? "-";
        document.getElementById(ticker + "-pre").innerText = q.rtp ?? "-";
        document.getElementById(ticker + "-after").innerText = q.rth ?? "-";
      }
    }
  };
}

["SNAL", "NEXR", "PRZO", "ASTC", "HL", "SBSW"].forEach(connectTV);
</script>

</body>
</html>
