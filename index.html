<!DOCTYPE html>
<html>
<head>
  <title>Stock Grid</title>
  <style>
    table {
      border-collapse: collapse;
      width: 500px;
      font-family: Arial;
    }
    th, td {
      border: 1px solid #444;
      padding: 6px;
      text-align: center;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>

<h2>Stock Prices (Yahoo Finance)</h2>

<table>
  <tr>
    <th>Ticker</th>
    <th>Last Close</th>
    <th>Pre‑Market</th>
    <th>After‑Hours</th>
  </tr>

  <tr><td>SNAL</td><td id="SNAL-close"></td><td id="SNAL-pre"></td><td id="SNAL-after"></td></tr>
  <tr><td>NEXR</td><td id="NEXR-close"></td><td id="NEXR-pre"></td><td id="NEXR-after"></td></tr>
  <tr><td>PRZO</td><td id="PRZO-close"></td><td id="PRZO-pre"></td><td id="PRZO-after"></td></tr>
  <tr><td>ASTC</td><td id="ASTC-close"></td><td id="ASTC-pre"></td><td id="ASTC-after"></td></tr>
  <tr><td>HL</td><td id="HL-close"></td><td id="HL-pre"></td><td id="HL-after"></td></tr>
  <tr><td>SBSW</td><td id="SBSW-close"></td><td id="SBSW-pre"></td><td id="SBSW-after"></td></tr>

</table>

<script>
async function loadQuote(ticker) {
  const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${ticker}`;

  const res = await fetch(url);
  const data = await res.json();
  const q = data.quoteResponse.result[0];

  document.getElementById(ticker + "-close").innerText = q.regularMarketPreviousClose ?? "-";
  document.getElementById(ticker + "-pre").innerText = q.preMarketPrice ?? "-";
  document.getElementById(ticker + "-after").innerText = q.postMarketPrice ?? "-";
}

["SNAL", "NEXR", "PRZO", "ASTC", "HL", "SBSW"].forEach(loadQuote);
</script>

</body>
</html>
